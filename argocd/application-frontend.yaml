apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/kumar200608/hall-allocation-aws.git'
    targetRevision: HEAD
    path: k8s/frontend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: hall-allocation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
