apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix-root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/kumar200608/hall-allocation-aws.git'
    targetRevision: HEAD
    path: argocd
    directory:
      recurse: false
      exclude: 'root-app.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
